name: Publish to pub.dev

# Uses pub.dev automated publishing (OIDC), so no secrets are stored in GitHub.
# One-time setup on https://pub.dev/packages/smart_phone_numb/admin:
#   Automated publishing -> Enable publishing from GitHub Actions
#   Repository: madhudus/smart_phone_numb
#   Tag pattern: v{{version}}
#   (optional) Require GitHub Actions environment: pub.dev
#
# Release by pushing a tag that matches the pubspec version, e.g.:
#   git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # Required to request the pub.dev OIDC token.
    steps:
      - uses: actions/checkout@v7

      # Configures the OIDC token used by `pub publish`.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Publish
        run: flutter pub publish --force
