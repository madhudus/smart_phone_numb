name: smart_phone_numb
description: "A Flutter phone number field that detects the user's country from the device timezone and validates the number length for the selected country."
version: 0.3.0
homepage: https://github.com/madhudus/smart_phone_numb
repository: https://github.com/madhudus/smart_phone_numb
issue_tracker: https://github.com/madhudus/smart_phone_numb/issues
topics:
  - phone
  - phone-number
  - country-code
  - form
  - timezone

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  country_code_picker: ^3.4.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
