name: smart_phone_numb
description: "A Flutter package for a smart phone number field that automatically suggests the country code and sets the phone number length dynamically based on timezone."
version: 0.2.4
homepage: https://github.com/madhudus/smart_phone_numb
repository: https://github.com/madhudus/smart_phone_numb.git

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  country_code_picker: ^3.4.1
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - lib/timezone_country_mapping.json
